<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>💰 Money Tracker</h1>
      <label class="month">View:
        <input type="month" id="month">
        <button type="button" id="allTime" class="ghost">All time</button>
      </label>
    </header>

    <section class="cards">
      <div class="card"><span>Income</span><strong id="sumIncome">₱0.00</strong></div>
      <div class="card"><span>Expenses</span><strong id="sumExpense" class="neg">₱0.00</strong></div>
      <div class="card"><span>Saved</span><strong id="sumSaving" class="pos">₱0.00</strong></div>
      <div class="card"><span>Cash left</span><strong id="sumBalance">₱0.00</strong></div>
    </section>
    <p class="hint" id="rate"></p>

    <section class="panel">
      <h2>Add entry</h2>
      <form id="form">
        <select id="type" aria-label="Type">
          <option value="income">Income / Salary</option>
          <option value="expense" selected>Expense</option>
          <option value="saving">Savings</option>
        </select>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <select id="category" aria-label="Category"></select>
        <input id="date" type="date" required>
        <input id="note" type="text" placeholder="Note (optional)" maxlength="80">
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="panel">
      <h2>Expenses by category</h2>
      <div id="breakdown"></div>
    </section>

    <section class="panel">
      <h2>Transactions</h2>
      <ul id="list"></ul>
      <p id="empty" class="hint">No entries yet.</p>
    </section>

    <footer>
      <button type="button" id="export" class="ghost">Export backup</button>
      <label class="ghost btn">Import backup<input type="file" id="import" accept="application/json" hidden></label>
      <small>Data is stored only in this browser. Export regularly.</small>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
